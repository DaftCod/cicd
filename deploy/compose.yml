x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  db:
    image: postgres:17-alpine
    env_file: ["${ENV_FILE:?}"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [back]
    restart: unless-stopped
    logging: *logging

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [back]
    restart: unless-stopped
    logging: *logging

  backend:
    image: ${REGISTRY_IMAGE:?}/backend:${IMAGE_TAG:?}
    env_file: ["${ENV_FILE:?}"]
    init: true
    depends_on:
      db:    { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/manage/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s
    deploy:
      resources:
        limits: { memory: 1G }
    networks: [front, back]
    restart: unless-stopped
    logging: *logging

  nginx:
    image: ${REGISTRY_IMAGE:?}/frontend:${IMAGE_TAG:?}
    ports:
      - "${HTTP_PORT:?}:80"
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks: [front]
    restart: unless-stopped
    logging: *logging

networks:
  front: {}
  back:
    internal: true

volumes:
  pgdata: {}
  redisdata: {}
