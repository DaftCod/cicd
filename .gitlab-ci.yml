# .gitlab-ci.yml

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

stages:
  - lint
  - test
  - build
  - verify
  - release

nginx-lint:
  stage: lint
  image:
    name: nginx:1.28-alpine
    entrypoint: [""]
  script:
    - echo "127.0.0.1 backend" >> /etc/hosts
    - cp frontend/nginx/default.conf /etc/nginx/conf.d/default.conf
    - nginx -t
  rules:
    - changes: [frontend/nginx/**/*]

# ─────────────── BUILDCACHE ───────────────
.docker-build:
  stage: build
  image: docker:28
  services:
    - docker:28-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker context create ci-context
    - docker buildx create --name ci-builder --driver docker-container --use ci-context
  script:
    - >
      docker buildx build
      --cache-from type=registry,ref=$IMAGE:buildcache
      --cache-to type=registry,ref=$IMAGE:buildcache,mode=max
      --tag $IMAGE:$CI_COMMIT_SHORT_SHA
      --push
      $CONTEXT

build-backend:
  extends: .docker-build
  variables:
    IMAGE: $CI_REGISTRY_IMAGE/backend
    CONTEXT: backend
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [backend/**/*]

build-frontend:
  extends: .docker-build
  variables:
    IMAGE: $CI_REGISTRY_IMAGE/frontend
    CONTEXT: frontend
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [frontend/**/*]

# ─────────────── FRONTEND ───────────────
frontend-lint:
  stage: lint
  image: node:22-alpine
  cache:
    key:
      files: [frontend/package-lock.json]
    paths: [frontend/.npm/]
  before_script:
    - cd frontend
    - npm ci --cache .npm --prefer-offline
  script:
    - npm run lint
  rules:
    - changes: [frontend/**/*]

frontend-test:
  stage: test
  image: node:22-alpine
  cache:
    key:
      files: [frontend/package-lock.json]
    paths: [frontend/.npm/]
    policy: pull
  before_script:
    - cd frontend
    - npm ci --cache .npm --prefer-offline
  script:
    - npm run test --if-present --watchAll=false
  rules:
    - changes: [frontend/**/*]

# ─────────────── BACKEND ───────────────
backend-test:
  stage: test
  image: eclipse-temurin:21-jdk
  services:
    - name: postgres:17-alpine
      alias: postgres
      variables:
        POSTGRES_DB: app
        POSTGRES_USER: app
        POSTGRES_PASSWORD: ci_test
    - name: redis:7-alpine
      alias: redis
  variables:
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
    GRADLE_OPTS: "-Dorg.gradle.daemon=false"
    SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/app
    SPRING_DATASOURCE_USERNAME: app
    SPRING_DATASOURCE_PASSWORD: ci_test
    SPRING_DATA_REDIS_HOST: redis
  cache:
    key:
      files: [backend/build.gradle.kts, backend/gradle/wrapper/gradle-wrapper.properties]
    paths: [.gradle/caches/, .gradle/wrapper/]
  script:
    - cd backend
    - ./gradlew check
  artifacts:
    when: always
    reports:
      junit: backend/build/test-results/test/**/TEST-*.xml
  rules:
    - changes: [backend/**/*]
# ─────────────── RELEASE ───────────────
release-images:
  stage: release
  extends: .docker-build
  script:
    - |
      for svc in backend frontend; do
        docker buildx imagetools create \
          --tag "$CI_REGISTRY_IMAGE/$svc:$CI_COMMIT_TAG" \
          "$CI_REGISTRY_IMAGE/$svc:$CI_COMMIT_SHORT_SHA"
      done
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

smoke-test:
  stage: verify
  image:
    name: curlimages/curl:8.11.1
    entrypoint: [""]
  variables:
    FF_NETWORK_PER_BUILD: "true"
    CI_DEBUG_SERVICES: "true"
  services:
    - name: postgres:17-alpine
      alias: postgres
      variables:
        POSTGRES_DB: app
        POSTGRES_USER: app
        POSTGRES_PASSWORD: ci_smoke
    - name: redis:7-alpine
      alias: redis
    - name: $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA
      alias: backend
      variables:
        SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/app
        SPRING_DATASOURCE_USERNAME: app
        SPRING_DATASOURCE_PASSWORD: ci_smoke
        SPRING_DATA_REDIS_HOST: redis
        SPRING_DATASOURCE_HIKARI_INITIALIZATIONFAILTIMEOUT: "60000"
    - name: $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA
      alias: frontend
  script:
    - curl -sS -o /dev/null --retry 40 --retry-delay 3 --retry-connrefused http://backend:8080/
    - curl -fsS -o /dev/null http://frontend/
    - 'code=$(curl -s -o /dev/null -w "%{http_code}" http://frontend/api/); echo "nginx -> backend: HTTP $code"; [ "$code" != "502" ] && [ "$code" != "504" ]'
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
