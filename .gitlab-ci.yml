# .gitlab-ci.yml

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

stages:
  - lint
  - test

# ─────────────── FRONTEND ───────────────
frontend-lint:
  stage: lint
  image: node:22-alpine
  cache:
    key:
      files: [frontend/package-lock.json]
    paths: [frontend/.npm/]
  before_script:
    - cd frontend
    - npm ci --cache .npm --prefer-offline
  script:
    - npm run lint
  rules:
    - changes: [frontend/**/*]

frontend-test:
  stage: test
  image: node:22-alpine
  cache:
    key:
      files: [frontend/package-lock.json]
    paths: [frontend/.npm/]
    policy: pull
  before_script:
    - cd frontend
    - npm ci --cache .npm --prefer-offline
  script:
    - npm run test --if-present --watchAll=false
  rules:
    - changes: [frontend/**/*]

# ─────────────── BACKEND ───────────────
backend-test:
  stage: test
  image: eclipse-temurin:21-jdk
  variables:
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
    GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  cache:
    key:
      files: [backend/build.gradle.kts, backend/gradle/wrapper/gradle-wrapper.properties]
    paths: [.gradle/caches/, .gradle/wrapper/]
  script:
    - cd backend
    - ./gradlew check
  artifacts:
    when: always
    reports:
      junit: backend/build/test-results/test/**/TEST-*.xml
  rules:
    - changes: [backend/**/*]
