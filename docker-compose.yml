name: javaapp

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  certgen:
    image: alpine/openssl:latest
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        test -f /certs/server.crt && echo "certificate exists" && exit 0;
        openssl req -x509 -nodes -newkey rsa:2048 -days 365
        -keyout /certs/server.key -out /certs/server.crt
        -subj "/CN=${APP_DOMAIN}"
        -addext "subjectAltName=DNS:${APP_DOMAIN}"
    volumes: [certs:/certs]
    network_mode: none
    restart: "no"

  db:
    image: postgres:17-alpine
    env_file: [./Java-app/back-end/.env]
    volumes:
      - ${PG_DATA_DIR:?Укажите PG_DATA_DIR в .env}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [back]
    restart: unless-stopped
    logging: *logging

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [back]
    restart: unless-stopped
    logging: *logging

  backend:
    build: ./Java-app/back-end
    image: javaapp-backend:1.0
    env_file: [./Java-app/back-end/.env]
    init: true
    depends_on:
      db:    { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/manage/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s
    deploy:
      resources:
        limits: { memory: 1G }
    networks: [front, back]
    restart: unless-stopped
    logging: *logging

  nginx:
    build: ./Java-app/front-end
    image: javaapp-frontend:1.0
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - certs:/etc/nginx/certs:ro
    depends_on:
      certgen: { condition: service_completed_successfully }
      backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost:8080/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks: [front]
    restart: unless-stopped
    logging: *logging

networks:
  front: {}
  back:
    internal: true

volumes:
  certs: {}
  redisdata: {}
